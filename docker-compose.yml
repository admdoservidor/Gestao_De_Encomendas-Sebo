services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sebo}"
      POSTGRES_USER: "${POSTGRES_USER:-sebo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sebo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-False}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      # Opção A (local): banco do compose
      POSTGRES_DB: "${POSTGRES_DB:-sebo}"
      POSTGRES_USER: "${POSTGRES_USER:-sebo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      # Opção B (Supabase): repassadas ao container quando definidas;
      # o settings.py prioriza a URL sobre as variáveis acima.
      sebo_POSTGRES_URL: "${sebo_POSTGRES_URL:-}"
      sebo_POSTGRES_PRISMA_URL: "${sebo_POSTGRES_PRISMA_URL:-}"
      sebo_POSTGRES_HOST: "${sebo_POSTGRES_HOST:-}"
      sebo_POSTGRES_DATABASE: "${sebo_POSTGRES_DATABASE:-}"
      sebo_POSTGRES_PASSWORD: "${sebo_POSTGRES_PASSWORD:-}"
      POSTGRES_URL: "${POSTGRES_URL:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
